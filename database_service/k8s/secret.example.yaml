# Copy this file to secret.yaml and replace both CHANGE_ME values.
# secret.yaml is gitignored so credentials are not committed.
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
type: Opaque
stringData:
  postgres-password: CHANGE_ME
  database-url: postgresql+psycopg2://postgres:CHANGE_ME@postgres-service:5432/bank_marketing
