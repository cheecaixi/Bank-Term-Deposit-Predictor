# ============================================================
# POSTGRESQL DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:

        - name: postgres

          image: postgres:16

          ports:
            - containerPort: 5432

          env:

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: postgres-db

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: postgres-user

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: postgres-password

          volumeMounts:

            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:

        - name: postgres-storage

          persistentVolumeClaim:
            claimName: postgres-pvc


---

# ============================================================
# DATABASE API DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: database-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: database-service

  template:
    metadata:
      labels:
        app: database-service

    spec:
      containers:

        - name: database-service

          image: database_service-database-api:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: database-url
