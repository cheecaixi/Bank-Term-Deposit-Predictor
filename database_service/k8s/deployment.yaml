# ============================================================
# POSTGRESQL DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:

        - name: postgres

          image: postgres:16

          ports:
            - containerPort: 5432

          env:

            - name: POSTGRES_DB
              value: bank_marketing

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: postgres

          volumeMounts:

            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:

        - name: postgres-storage

          persistentVolumeClaim:
            claimName: postgres-pvc


---

# ============================================================
# DATABASE API DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: database-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: database-service

  template:
    metadata:
      labels:
        app: database-service

    spec:
      containers:

        - name: database-service

          # CHANGE THIS TO YOUR DOCKER HUB IMAGE
          image: your-dockerhub-username/database-service:latest

          ports:
            - containerPort: 8000

          env:

            - name: DATABASE_URL

              value: "postgresql+psycopg2://postgres:postgres@postgres-service:5432/bank_marketing"