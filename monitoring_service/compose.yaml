# Runs the Monitoring Service using Docker Compose with service URLs,
# persistent monitoring data storage, and port configuration.
version: '3.8'
services:
  monitoring-service:
    build:   # Builds the Monitoring Service Docker image
      context: .
      dockerfile: Dockerfile
    # Configures the services to monitor and monitoring settings
    environment:
      AI_SERVICE_URL: http://host.docker.internal:7000
      GATEWAY_SERVICE_URL: http://host.docker.internal:8080
      DATABASE_SERVICE_URL: http://host.docker.internal:8000
      DASHBOARD_SERVICE_URL: http://host.docker.internal:8501
      MONITORING_DATABASE_PATH: /data/monitoring.db
      POLL_INTERVAL_SECONDS: "30"
    ports: # Exposes the Monitoring Service on port 7002
      - "7002:7002"
    volumes:  # Stores monitoring data persistently
      - monitoring_data:/data
    restart: unless-stopped  # Automatically restarts the service unless manually stopped

# Defines persistent storage for the monitoring database
volumes:
  monitoring_data:
