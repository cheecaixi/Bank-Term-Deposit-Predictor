services:
  ai-inference:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-inference:v1
    container_name: ai-inference

    ports:
      - "7000:7000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:7000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped