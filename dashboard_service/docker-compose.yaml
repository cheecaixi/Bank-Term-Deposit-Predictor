version: '3.8'
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard

    # Map host port 8501 to Streamlit port 8501
    ports:
      - "8501:8501"

    # Environment variables
    environment:
      # API Gateway address
      GATEWAY_URL: "http://host.docker.internal:8080"

    # Automatically restart the container if it stops unexpectedly
    restart: unless-stopped