# Horizontal Pod Autoscaler (HPA)
# Automatically increases or decreases Dashboard pods based on average CPU utilization

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: dashboard-hpa

spec:
  # Deployment managed by this HPA
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dashboard

  # At least 3 pods remain available during low traffic
  minReplicas: 3

  # The Dashboard can scale up to 5 pods during high traffic
  maxReplicas: 5

  # Metrics used to determine when scaling is required
  metrics:
    - type: Resource
      resource:
        # Monitor CPU usage
        name: cpu

        target:
          # Scale based on average CPU utilization across all Dashboard pods
          type: Utilization

          # When average CPU usage goes above 70%, Kubernetes increases the number of pods
          # scales down when utilization falls sufficiently below the target
          averageUtilization: 70