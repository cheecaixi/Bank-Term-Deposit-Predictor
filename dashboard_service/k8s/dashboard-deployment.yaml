# Dashboard Deployment
# Manages the Streamlit Dashboard pods and maintains the desired number of replicas

apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard

spec:
  replicas: 3
  revisionHistoryLimit: 5   # Keep the last five ReplicaSets available for rollback
  minReadySeconds: 10       # A pod must remain ready for 10 seconds before Kubernetes considers it available

  strategy:
    type: RollingUpdate
    rollingUpdate:

      maxSurge: 1         # Allow one additional pod during an update
      maxUnavailable: 0   # Ensure all existing available pods remain available

  # Selector identifying the Dashboard pods managed by this Deployment
  selector:
    matchLabels:
      app: dashboard

  template:
    metadata:
      # Must match both the Deployment selector and the Dashboard Service selector
      labels:
        app: dashboard

    spec:
      containers:
          name: dashboard
          image: cheecaixi/dashboard:latest

          # Always check the registry for the latest image
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8501
              protocol: TCP

          # API Gateway configuration
          env:
              name: GATEWAY_URL

              valueFrom:
                configMapKeyRef:
                  name: dashboard-config
                  key: GATEWAY_URL

          # Resource requests and limits for each Dashboard pod
          resources:
            requests:
              # Minimum CPU requested by the pod
              cpu: "100m"

              # Minimum memory requested by the pod
              memory: "128Mi"

            limits:
              # Maximum CPU the pod can use
              cpu: "500m"

              # Maximum memory the pod can use
              memory: "512Mi"

          # Readiness probe checks whether the pod is ready to receive traffic
          readinessProbe:
            httpGet:
              path: /     # Streamlit root page
              port: http  # Streamlit port

            # Wait 10 seconds after startup before checking
            initialDelaySeconds: 10

            # Check readiness every 10 seconds
            periodSeconds: 10

            # Each health check must receive a response within 5 seconds
            timeoutSeconds: 5

            # Kubernetes allows up to 3 consecutive failed check before the probe is considered failed
            failureThreshold: 3

            # Only 1 successful check is required for the probe to be considered successful
            successThreshold: 1

          # Liveness probe checks whether the container is still running correctly
          # If it repeatedly fails, Kubernetes can restart it
          livenessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
