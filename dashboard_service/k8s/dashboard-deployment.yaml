apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: dashboard-service

  template:
    metadata:
      labels:
        app: dashboard-service

    spec:
      containers:
        - name: dashboard-service

          image: cheecaixi/bank-dashboard:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8501

          env:
            - name: GATEWAY_URL
              value: "http://api-gateway-service:8080"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"