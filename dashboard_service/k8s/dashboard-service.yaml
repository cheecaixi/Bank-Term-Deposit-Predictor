# Dashboard Service
# Exposes the Streamlit Dashboard within the Kubernetes cluster and externally through a NodePort

apiVersion: v1
kind: Service

metadata:
  name: dashboard-service

spec:
  # NodePort allows the dashboard to be accessed externally through the Minikube node IP and assigned NodePort
  type: NodePort

  selector:
    # Routes traffic to Dashboard pods matching this label
    app: dashboard

  ports:
    - name: http
      protocol: TCP

       # Service port exposed inside the Kubernetes cluster
      port: 8501

      # Port on which the Streamlit container is listening
      targetPort: 8501

      # External port exposed by the Minikube node
      nodePort: 30085