apiVersion: v1
kind: Service
metadata:
  # Stable DNS name used by other Kubernetes services.
  name: api-gateway-service
spec:
  # NodePort exposes the gateway outside the cluster in Minikube.
  type: NodePort
  selector:
    # Send traffic to pods carrying the matching application label.
    app: api-gateway
  ports:
  - protocol: TCP
    # Service and container ports used by FastAPI.
    port: 8080
    targetPort: 8080
    # Host-facing Minikube port for external access.
    nodePort: 30080