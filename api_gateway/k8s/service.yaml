apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service         # 1. Internal DNS name used by other pods
spec:
  type: NodePort                    # 2. Exposes the service externally on Minikube
  selector:
    app: api-gateway                # 3. Directs traffic to pods labeled 'app: api-gateway'
  ports:
  - protocol: TCP
    port: 8080                      # 4. Service Port inside the cluster
    targetPort: 8080                # 5. Container Port running your FastAPI app
    nodePort: 30080                 # 6. External Port accessible on Minikube/localhost