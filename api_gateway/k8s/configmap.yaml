apiVersion: v1
kind: ConfigMap
metadata:
  # Shared non-sensitive configuration for gateway pods.
  name: api-gateway-config
data:
  # Kubernetes service DNS names used by the gateway for internal requests.
  INFERENCE_SERVICE_URL: "http://ai-inference-service:7000"
  DATABASE_SERVICE_URL: "http://database-service:8000"
  # This value should match the Monitoring Service Kubernetes Service port.
  MONITORING_SERVICE_URL: "http://monitoring-service:7002"
  TIMEOUT_SECONDS: "5.0"